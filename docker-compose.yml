version: '3.8'

services:
  music-party-gate:
    build:
      context: .
      dockerfile: Dockerfile
    image: music-party-gate:latest
    container_name: music-party-gate
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - PARTY_URL=${PARTY_URL:-https://home.raverendo.com/#/party}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-party}
      - THEME=${THEME:-halloween}
    volumes:
      - ./data:/app/data


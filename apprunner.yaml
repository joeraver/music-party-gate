version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm install
      - npm run build
run:
  command: node server/server.js
  network:
    port: 3000
    env: APP_PORT
  env:
    - name: PORT
      value: "3000"
    - name: PARTY_URL
      value: "https://home.raverendo.com/#/party"
    - name: ADMIN_PASSWORD
      value: "party"
    - name: THEME
      value: "halloween"
